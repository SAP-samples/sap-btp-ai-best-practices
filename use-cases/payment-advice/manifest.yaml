---
applications:
  - name: payment-advice-automation-api
    path: api
    buildpack: python_buildpack
    command: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    memory: 512M
    disk_quota: 2G
    routes:
      - route: payment-advice-automation-api.cfapps.eu10-005.hana.ondemand.com
    env:
      ALLOWED_ORIGIN: https://payment-advice-automation.cfapps.eu10-005.hana.ondemand.com
      API_BASE_URL: https://payment-advice-automation-api.cfapps.eu10-005.hana.ondemand.com
      APP_ENV: production
      API_KEY: ((api_key))
      AICORE_AUTH_URL: ((aicore_auth_url))
      AICORE_CLIENT_ID: ((aicore_client_id))
      AICORE_CLIENT_SECRET: ((aicore_client_secret))
      AICORE_BASE_URL: ((aicore_base_url))
      AICORE_RESOURCE_GROUP: ((aicore_resource_group))
      HANA_ADDRESS: ((hana_address))
      HANA_PORT: ((hana_port))
      HANA_USER: ((hana_user))
      HANA_PASSWORD: ((hana_password))
      HANA_ENCRYPT: ((hana_encrypt))
  - name: payment-advice-automation
    path: ui
    buildpack: nodejs_buildpack
    command: npm run build && npx vite preview --host 0.0.0.0 --port $PORT
    memory: 512M
    routes:
      - route: payment-advice-automation.cfapps.eu10-005.hana.ondemand.com
    env:
      VITE_API_BASE_URL: https://payment-advice-automation-api.cfapps.eu10-005.hana.ondemand.com
      VITE_APP_HOST: payment-advice-automation.cfapps.eu10-005.hana.ondemand.com
      VITE_API_KEY: ((api_key))
