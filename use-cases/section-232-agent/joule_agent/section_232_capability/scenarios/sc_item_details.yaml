description: >
  Retrieve details and stored Section 232 analysis for one item. Use this only
  when the user gives a canonical Material Master item id beginning with
  "mm:". Product codes and material numbers such as SYN-10001 must use the item
  search scenario first, even when the user asks for details. Examples: "Show
  details for mm:1001", "review item mm:2002", or "why was mm:1001 classified
  this way?".

slots:
  - name: item_id
    description: >
      Backend Material Master item id, in the form mm:1001. Capture the complete
      value including the prefix and colon. Do not treat a product code or
      material number without the mm: prefix as an item id.

target:
  name: fn_item_details
  type: function
