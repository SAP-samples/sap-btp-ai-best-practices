<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/SAP_logo_square.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evaluation Assessment Assistant</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      /* Hide entire app until JavaScript loads and UI5 components are ready */
      #app {
        opacity: 0;
        transition: opacity 0s ease-in-out;
      }

      /* Show app when ready */
      #app.ready {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <ui5-navigation-layout id="nl1" mode="Collapsed">
        <ui5-shellbar slot="header" notifications-count="72" show-notifications>
          <ui5-button icon="menu2" slot="startButton" id="startButton"></ui5-button>
          <ui5-shellbar-branding slot="branding">
            Evaluation Assessment Assistant
            <img slot="logo" src="/images/SAP_logo.svg" />
          </ui5-shellbar-branding>
          <ui5-shellbar-search slot="searchField" show-clear-icon placeholder="Search Apps, Products"></ui5-shellbar-search>

          <ui5-shellbar-item id="help-shell-item" icon="sys-help" text="Help"></ui5-shellbar-item>
          <ui5-shellbar-item id="language-menu-button" icon="world" text="EN"></ui5-shellbar-item>
          <ui5-toggle-button icon="sap-icon://da" tooltip="Joule" slot="assistant"></ui5-toggle-button>
          <ui5-avatar slot="profile">
            <img src="/images/avatars/man_avatar_3.png" />
          </ui5-avatar>
        </ui5-shellbar>
        <ui5-popover id="language-popover" opener="language-menu-button" placement="Bottom">
          <div class="language-popover-content" role="menu" aria-label="Language">
            <button type="button" data-language-option="en" role="menuitem">EN</button>
            <button type="button" data-language-option="it" role="menuitem">IT</button>
          </div>
        </ui5-popover>

        <ui5-side-navigation id="sn1" slot="sideContent">
          <!-- Items -->
          <ui5-side-navigation-item text="Document Manager" href="/home" icon="documents" selected></ui5-side-navigation-item>
          <ui5-side-navigation-item text="Super Admin Document Manager" href="/admin-documents" icon="document-text"></ui5-side-navigation-item>
          <ui5-side-navigation-item text="Assessment" href="/assessment" icon="form"></ui5-side-navigation-item>
          <ui5-side-navigation-item text="Score" href="/score" icon="business-objects-experience"></ui5-side-navigation-item>
        </ui5-side-navigation>

        <div class="content">
          <!-- Page content will be loaded dynamically here -->
        </div>
      </ui5-navigation-layout>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
