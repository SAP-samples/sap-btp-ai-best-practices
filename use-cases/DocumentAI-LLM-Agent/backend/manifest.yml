---
applications:
  - name: docai-backend
    memory: 1024M
    disk_quota: 1024M
    instances: 1
    buildpacks:
      - python_buildpack
    command: gunicorn api:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --log-level info
