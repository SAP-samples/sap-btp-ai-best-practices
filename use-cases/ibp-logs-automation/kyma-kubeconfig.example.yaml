---
# Example Kyma kubeconfig — replace all placeholder values with your own.
# The real `kyma-kubeconfig.yaml` is gitignored and MUST NOT be committed.
apiVersion: v1
kind: Config
current-context: <your-kyma-context>
clusters:
  - name: <your-kyma-context>
    cluster:
      certificate-authority-data: <base64-encoded-ca-cert>
      server: https://api.<your-kyma-cluster>.kyma.ondemand.com
contexts:
  - name: <your-kyma-context>
    context:
      cluster: <your-kyma-context>
      user: <your-kyma-context>
users:
  - name: <your-kyma-context>
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        args:
          - get-token
          - "--oidc-issuer-url=https://kyma.accounts.ondemand.com"
          - "--oidc-client-id=<your-oidc-client-id>"
          - "--oidc-extra-scope=email"
          - "--oidc-extra-scope=openid"
        command: kubectl-oidc_login