# kyma/secret-template.yaml
# Template for the Kyma secret that holds the IBP session cookies.
#
# Create the secret (replace the path with your actual cookies file):
#
#   kubectl create secret generic ibp-cookies \
#     --from-file=session_cookies.json=./backend/session_cookies.json \
#     -n <your-namespace>
#
# Update when cookies expire (re-export from Cookie-Editor, then):
#
#   kubectl create secret generic ibp-cookies \
#     --from-file=session_cookies.json=./new_cookies.json \
#     -n <your-namespace> \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The YAML below shows the structure — do NOT apply this directly.
# Use the kubectl commands above to create the actual secret.

apiVersion: v1
kind: Secret
metadata:
  name: ibp-cookies
type: Opaque
data:
  # session_cookies.json: <base64-encoded content>
  # Generated automatically by: kubectl create secret generic ibp-cookies --from-file=...
