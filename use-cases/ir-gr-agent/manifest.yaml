---
applications:
  - name: grir-api
    path: api
    buildpack: python_buildpack
    command: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    memory: 512M
    disk_quota: 2G
    routes:
      - route: grir-api.cfapps.((cf_app_domain))
    env:
      ALLOWED_ORIGIN: https://grir-ui.cfapps.((cf_app_domain))
      API_BASE_URL: https://grir-api.cfapps.((cf_app_domain))
      APP_ENV: production
      API_KEY: ((api_key))
      AICORE_AUTH_URL: ((aicore_auth_url))
      AICORE_CLIENT_ID: ((aicore_client_id))
      AICORE_CLIENT_SECRET: ((aicore_client_secret))
      AICORE_BASE_URL: ((aicore_base_url))
      AICORE_RESOURCE_GROUP: ((aicore_resource_group))

  - name: grir-ui
    path: ui
    buildpack: nodejs_buildpack
    command: npm run build && npx vite preview --host 0.0.0.0 --port $PORT
    memory: 256M
    routes:
      - route: grir-ui.cfapps.((cf_app_domain))
    env:
      VITE_API_BASE_URL: https://grir-api.cfapps.((cf_app_domain))
      VITE_APP_HOST: grir-ui.cfapps.((cf_app_domain))
      VITE_API_KEY: ((api_key))
